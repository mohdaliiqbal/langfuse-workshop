[project]
name = "langfuse-workshop"
version = "0.2.0"
description = "Python port of the Langfuse AI engineering workshop"
requires-python = "==3.14.*"
dependencies = [
    "openai>=1.0.0",
    "langfuse>=4.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
screenshots = ["playwright>=1.49.0"]

[tool.uv]
package = false
