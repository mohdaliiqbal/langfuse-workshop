name: Workshop smoke

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Monday 08:00 UTC. Weekly syncs can use this run as a regression check.
    - cron: "0 8 * * 1"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run the workshop smoke test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL || 'https://cloud.langfuse.com' }}
          LANGFUSE_PROMPT_NAME: ${{ secrets.LANGFUSE_PROMPT_NAME }}
          LANGFUSE_PROMPT_LABEL: ${{ secrets.LANGFUSE_PROMPT_LABEL }}
          DATASET_NAME: ${{ secrets.DATASET_NAME }}
        # Pull requests skip the model call. Monday and manual runs add --live,
        # which sends one chat turn and checks its trace when secrets are set.
        run: uv run python scripts/run_workshop.py ${{ github.event_name != 'pull_request' && '--live' || '' }}
